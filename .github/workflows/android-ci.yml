name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callvault-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the debug APK as a prerelease, so the Releases page has an
      # installable file for testing. This runs only on a push to main, not
      # on a pull request. A proper SIGNED release still comes from a v* tag
      # (see release.yml). This APK is a debug build, for testing only.
      - name: Prepare debug APK for the prerelease
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/callvault-latest-debug.apk

      - name: Publish the latest debug prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build (for testing)
          prerelease: true
          body: |
            This is an automatic debug build from the latest commit on main.
            It is for testing only. It is a debug APK, not a signed release.
            For a stable signed release, use a version tag (for example v1.0.0).
          files: dist/callvault-latest-debug.apk
