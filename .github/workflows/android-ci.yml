name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default. Only the publish job raises this.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callvault-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Publish the debug APK as a prerelease, so the Releases page has an
  # installable file for testing. This job runs only on a push to main.
  # It uses the first-party GitHub CLI, so there is no third-party action.
  # A proper SIGNED release still comes from a v* tag (see release.yml).
  publish-debug:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: callvault-debug
          path: dist

      - name: Rename the APK
        run: mv dist/app-debug.apk dist/callvault-latest-debug.apk

      - name: Publish the latest debug prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug dist/callvault-latest-debug.apk \
            --prerelease \
            --title "Latest debug build (for testing)" \
            --notes "Automatic debug build from the latest commit on main. For testing only. This is a debug APK, not a signed release. For a stable signed release, use a version tag (for example v1.0.0)."
